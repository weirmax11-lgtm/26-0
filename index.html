                { name: "Chris Scott", club: "GEE", era: "2010s", rating: 91, trait: "High Margin Modern Home Record" },
                { name: "Damien Hardwick", club: "RIC", era: "2010s", rating: 92, trait: "High Turnover Chaotic System" },

                { name: "Mick Malthouse", club: "WC", era: "1990s", rating: 93, trait: "Uncompromising Boundary Press" }
            ]
        };

        // Positions Schema mapping to structural Grid targets
        const positions = [
            { id: "F1", line: "Forward", label: "FF" },
            { id: "F2", line: "Forward", label: "FP L" },
            { id: "F3", line: "Forward", label: "FP R" },
            { id: "HF1", line: "Forward", label: "CHF" },
            { id: "HF2", line: "Forward", label: "HFF L" },
            { id: "HF3", line: "Forward", label: "HFF R" },
            { id: "M1", line: "Midfield", label: "C" },
            { id: "M2", line: "Midfield", label: "W L" },
            { id: "M3", line: "Midfield", label: "W R" },
            { id: "M4", line: "Midfield", label: "RUCK" },
            { id: "M5", line: "Midfield", label: "RR" },
            { id: "M6", line: "Midfield", label: "RVR" },
            { id: "HB1", line: "Defender", label: "CHB" },
            { id: "HB2", line: "Defender", label: "HBF L" },
            { id: "HB3", line: "Defender", label: "HBF R" },
            { id: "B1", line: "Defender", label: "FB" },
            { id: "B2", line: "Defender", label: "BP L" },
            { id: "B3", line: "Defender", label: "BP R" },
            { id: "COACH", line: "Coach", label: "COACH" }
        ];

        // Roster State Tracker
        let roster = {};
        let activeSpin = { club: null, era: null };
        let spinsAllotted = { club: 1, era: 1 };

        // DOM Element Definitions
        const btnMasterSpin = document.getElementById('btn-master-spin');
        const btnRerollClub = document.getElementById('btn-reroll-club');
        const btnRerollEra = document.getElementById('btn-reroll-era');
        const btnLockPlayer = document.getElementById('btn-lock-player');
        const btnStartSimulation = document.getElementById('btn-start-simulation');
        const displayClub = document.getElementById('display-club');
        const displayEra = document.getElementById('display-era');
        const selectionModule = document.getElementById('selection-module');
        const selectPosition = document.getElementById('select-position');
        const selectTarget = document.getElementById('select-target');
        const progressCount = document.getElementById('progress-count');
        const liveTeamRating = document.getElementById('live-team-rating');
        const phaseIndicator = document.getElementById('draft-phase-indicator');
        const simulationTicker = document.getElementById('simulation-ticker');

        // Render Dynamic Field Map Nodes
        function initFieldGrid() {
            positions.forEach(pos => {
                if(pos.id === "COACH") {
                    document.getElementById('coach-anchor-point').innerHTML = createNodeHTML(pos);
                } else {
                    const targetContainer = document.getElementById(`node-${pos.id}`);
                    if(targetContainer) targetContainer.innerHTML = createNodeHTML(pos);
                }
            });
        }

        function createNodeHTML(pos) {
            const hasData = roster[pos.id];
            if (hasData) {
                return `
                    <div class="bg-emerald-950/40 border border-emerald-500/50 p-1.5 rounded text-center shadow-md transition-all duration-300">
                        <div class="text-[9px] font-black uppercase text-emerald-400 tracking-tighter truncate">${hasData.name}</div>
                        <div class="text-[8px] text-zinc-400 font-medium truncate">${hasData.club_code} (${hasData.rating})</div>
                        <div class="text-[7px] text-emerald-600 font-bold uppercase tracking-widest mt-0.5">${pos.label}</div>
                    </div>
                `;
            }
            return `
                <div class="bg-zinc-900/40 border border-zinc-800 p-1.5 rounded text-center opacity-60 hover:opacity-80 transition-all duration-200">
                    <div class="text-[10px] font-mono font-bold text-zinc-600">--</div>
                    <div class="text-[7px] text-zinc-500 font-bold uppercase tracking-wider mt-1">${pos.label}</div>
                </div>
            `;
        }

        // Calculation of Interactive Rating updates
        function updateRosterMetrics() {
            const keys = Object.keys(roster);
            progressCount.innerText = keys.length;
            
            if (keys.length > 0) {
                let total = 0;
                keys.forEach(k => total += roster[k].rating);
                liveTeamRating.innerText = Math.round(total / keys.length);
            } else {
                liveTeamRating.innerText = "--";
            }

            // Unlock Match Processing State
            if (keys.length === 19) {
                btnStartSimulation.disabled = false;
                btnStartSimulation.className = "w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 font-black uppercase tracking-wider py-4 rounded-lg text-xs transition-all duration-150 cursor-pointer shadow-lg shadow-amber-500/10 animate-pulse";
                btnMasterSpin.disabled = true;
                btnMasterSpin.classList.add('hidden');
                phaseIndicator.innerText = "Complete";
            }
        }

        // Master Draft Spin Algorithm Engine
        function handleMasterSpin() {
            spinsAllotted = { club: 1, era: 1 };
            phaseIndicator.innerText = "Selecting";
            
            spinClubData();
            spinEraData();
            
            btnMasterSpin.disabled = true;
            btnMasterSpin.innerText = "Resolve Active Pick to Re-Spin";
            btnMasterSpin.className = "w-full bg-zinc-800 text-zinc-500 font-bold uppercase py-3 rounded-lg text-xs cursor-not-allowed";
            
            renderSelectionControls();
        }

        function spinClubData() {
            const roll = database.clubs[Math.floor(Math.random() * database.clubs.length)];
            activeSpin.club = roll;
            displayClub.innerText = roll.name;
            btnRerollClub.disabled = spinsAllotted.club === 0;
        }

        function spinEraData() {
            const roll = database.eras[Math.floor(Math.random() * database.eras.length)];
            activeSpin.era = roll;
            displayEra.innerText = roll;
            btnRerollEra.disabled = spinsAllotted.era === 0;
        }

        // Dropdown Generation Rules
        function renderSelectionControls() {
            selectionModule.classList.remove('hidden');
            selectPosition.innerHTML = '';
            
            let count = 0;
            positions.forEach(pos => {
                if(!roster[pos.id]) {
                    const opt = document.createElement('option');
                    opt.value = pos.id;
                    opt.innerText = pos.label;
                    selectPosition.appendChild(opt);
                    count++;
                }
            });

            if (count > 0) {
                populateTargetPersonnelList();
            }
        }

        function populateTargetPersonnelList() {
            selectTarget.innerHTML = '';
            const activeSlotId = selectPosition.value;
            const posConfig = positions.find(p => p.id === activeSlotId);

            if (posConfig.line === "Coach") {
                // Coach Filter Execution
                const pool = database.coaches.filter(c => c.club === activeSpin.club.id && c.era === activeSpin.era);
                if (pool.length === 0) {
                    appendFallbackOption(`No ${activeSpin.era} Coach found for ${activeSpin.club.id}`);
                } else {
                    pool.forEach(c => appendPersonnelOption(c, 'coach'));
                }
            } else {
                // Player Filter Execution
                const pool = database.players.filter(p => p.club === activeSpin.club.id && p.era === activeSpin.era && p.line === posConfig.line);
                if (pool.length === 0) {
                    appendFallbackOption(`No ${activeSpin.era} ${posConfig.line}s on list`);
                } else {
                    pool.forEach(p => appendPersonnelOption(p, 'player'));
                }
            }
        }

        function appendPersonnelOption(obj, type) {
            const opt = document.createElement('option');
            opt.value = JSON.stringify({ name: obj.name, rating: obj.rating, type: type });
            // Monospaced aligned output grid configuration
            const displayRating = String(obj.rating).padEnd(2, ' ');
            const metrics = type === 'coach' ? `Trait: ${obj.trait}` : obj.stats;
            opt.innerText = `[OVR: ${displayRating}] ${obj.name.padEnd(18, ' ')} -> ${metrics}`;
            selectTarget.appendChild(opt);
        }

        function appendFallbackOption(msg) {
            const opt = document.createElement('option');
            opt.innerText = msg;
            opt.disabled = true;
            selectTarget.appendChild(opt);
        }

        // Lock Selection Action Function
        function lockSelectionToField() {
            if (!selectTarget.value || selectTarget.value.startsWith("No")) {
                alert("Please select a valid player or resolve via re-spin options.");
                return;
            }

            const slotId = selectPosition.value;
            const parsed = JSON.parse(selectTarget.value);

            roster[slotId] = {
                name: parsed.name,
                rating: parsed.rating,
                club_code: activeSpin.club.id,
                era: activeSpin.era
            };

            // Reset Interface Systems
            selectionModule.classList.add('hidden');
            displayClub.innerText = "[Ready]";
            displayEra.innerText = "[Ready]";
            btnRerollClub.disabled = true;
            btnRerollEra.disabled = true;
            
            btnMasterSpin.disabled = false;
            btnMasterSpin.innerText = "Spin Draft Wheels";
            btnMasterSpin.className = "w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black uppercase tracking-wider py-3 rounded-lg text-xs transition-all duration-150 cursor-pointer shadow-lg shadow-amber-500/5";
            phaseIndicator.innerText = "Idle";

            initFieldGrid();
            updateRosterMetrics();
        }

        // Dynamic 26-Game Football Simulation Algorithm
        function executeSimulationEngine() {
            simulationTicker.classList.remove('hidden');
            simulationTicker.innerHTML = '';
            
            let totalRatingSum = 0;
            positions.forEach(p => totalRatingSum += roster[p.id].rating);
            const overallPowerRating = totalRatingSum / 19;

            // Algorithm dynamic ceiling mapping logic
            const probabilityScale = (overallPowerRating - 85) / 15; 
            const targetWinProbability = Math.max(0.42, Math.min(0.98, 0.5 + (probabilityScale * 0.45)));

            let totalWins = 0;
            let totalLosses = 0;
            let fixtureIndex = 1;

            function runFixtureLoop() {
                if (fixtureIndex <= 26) {
                    const isFinals = fixtureIndex > 23;
                    let roundTitle = isFinals ? `FINALS WEEK ${fixtureIndex - 23}` : `ROUND ${fixtureIndex}`;
                    if (fixtureIndex === 26) roundTitle = "GRAND FINAL";

                    const randRoll = Math.random();
                    // Finals introduce localized scaling penalty vectors to stress structural depth
                    const executionCutoff = isFinals ? (targetWinProbability - 0.04) : targetWinProbability;

                    let isWin = randRoll <= executionCutoff;
                    
                    // Generate realistic organic score arrays matching professional profiles
                    const baseSquadScore = Math.round(overallPowerRating + (Math.random() * 40) + 45);
                    const baseOpponentScore = Math.round(88 + (Math.random() * 40));
                    
                    let squadScore, opponentScore;
                    if (isWin) {
                        squadScore = Math.max(baseSquadScore, baseOpponentScore + Math.floor(Math.random() * 15) + 1);
                        opponentScore = baseOpponentScore;
                        totalWins++;
                    } else {
                        opponentScore = Math.max(baseOpponentScore, baseSquadScore + Math.floor(Math.random() * 15) + 1);
                        squadScore = baseSquadScore;
                        totalLosses++;
                    }

                    const matchLine = document.createElement('div');
                    matchLine.className = isWin ? "text-emerald-400 border-l-2 border-emerald-500 pl-2 py-0.5" : "text-rose-500 border-l-2 border-rose-500 pl-2 py-0.5";
                    matchLine.innerText = `[${roundTitle}] Squad ${squadScore} def ${isWin ? 'by' : 'opp'} ${opponentScore} -> ${isWin ? 'WIN' : 'LOSS'} (${totalWins}-${totalLosses})`;
                    
                    simulationTicker.appendChild(matchLine);
                    simulationTicker.scrollTop = simulationTicker.scrollHeight;

                    // Absolute Sudden Death Rule for Finals Series
                    if (isFinals && !isWin) {
                        const deathLine = document.createElement('div');
                        deathLine.className = "text-center text-zinc-100 bg-rose-950/50 border border-rose-800 p-2 rounded mt-2 font-bold uppercase tracking-wide";
                        deathLine.innerText = `🚨 ELIMINATED: High stakes structure failed under Finals pressure. Final Run Record: ${totalWins}-${totalLosses}`;
                        simulationTicker.appendChild(deathLine);
                        return;
                    }

                    fixtureIndex++;
                    setTimeout(runFixtureLoop, 120);
                } else {
                    // Match Loop complete verification logic
                    const conclusionBanner = document.createElement('div');
                    conclusionBanner.className = "text-center p-3 rounded mt-3 font-black tracking-wide uppercase text-xs";
                    if (totalWins === 26) {
                        conclusionBanner.className += " bg-amber-500 text-zinc-950 shadow-lg shadow-amber-500/20";
                        conclusionBanner.innerText = `🏆 IMMORTALITY CAPTURED: Perfect 26-0 Campaign Documented. Your tactical framework has gone down in history!`;
                    } else {
                        conclusionBanner.className += " bg-zinc-800 text-zinc-300 border border-zinc-700";
                        conclusionBanner.innerText = `🏁 FINISHED: Campaign finished with a strong ${totalWins}-${totalLosses} campaign record. Try again for perfection!`;
                    }
                    simulationTicker.appendChild(conclusionBanner);
                }
            }

            runFixtureLoop();
        }

        // Active Event Mapping Wireframes
        btnMasterSpin.addEventListener('click', handleMasterSpin);
        selectPosition.addEventListener('change', populateTargetPersonnelList);
        btnLockPlayer.addEventListener('click', lockSelectionToField);
        btnStartSimulation.addEventListener('click', executeSimulationEngine);

        btnRerollClub.addEventListener('click', () => {
            spinsAllotted.club--;
            btnRerollClub.disabled = true;
            spinClubData();
            renderSelectionControls();
        });

        btnRerollEra.addEventListener('click', () => {
            spinsAllotted.era--;
            btnRerollEra.disabled = true;
            spinEraData();
            renderSelectionControls();
        });

        // App Component Initialization boot hook
        initFieldGrid();
    </script>
</body>
</html>
